name: Daily data update

# Checks Baseball Savant for new games about every 15-25 minutes: each run starts the next one 15 minutes after it
# ends. The hourly schedule is only a backup that restarts the chain (GitHub often starts scheduled runs hours late).
# A check with no new pitches ends in about a minute; new pitches are graded, the data rebuilt, and this site and the
# online app updated. Runs on GitHub, not on a computer.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if there are no new pitches"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          path: site

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Get the pipeline code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub==2.2.0
          python -c "from huggingface_hub import snapshot_download; snapshot_download('DanielVonder/propitching-data', repo_type='dataset', local_dir='work', allow_patterns=['src/*'])"
          pip install -q -r work/src/requirements_cloud.txt

      - name: Update the data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python work/src/cloud_update.py --site site ${{ inputs.force && '--force' || '' }}

      - name: Publish the site
        working-directory: site
        run: |
          git config user.name "ProPitching Index update"
          git config user.email "daniel.vonder@gmail.com"
          git add -A data index.html
          if git diff --cached --quiet; then echo "Site already up to date"; exit 0; fi
          git commit -q -m "Update data"
          # another run or a manual change may have pushed meanwhile: take theirs, put this run's data on top
          for i in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep 10
          done
          exit 1

      - name: Start the next check in 15 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 900
          others=$(gh run list --repo "${{ github.repository }}" --workflow update.yml --limit 20 \
            --json databaseId,status -q '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$others" = "0" ]; then gh workflow run update.yml --repo "${{ github.repository }}"; else echo "Another check is already queued"; fi
